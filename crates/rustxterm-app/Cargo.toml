[package]
name = "rustxterm-app"
description = "Tauri application entry point for RustXterm"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rustxterm-app"
path = "src/main.rs"

[dependencies]
rustxterm-core = { path = "../rustxterm-core" }
rustxterm-session = { path = "../rustxterm-session" }
rustxterm-ssh = { path = "../rustxterm-ssh" }
rustxterm-credentials = { path = "../rustxterm-credentials" }
tauri = { workspace = true, features = ["devtools"] }
tokio = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
portable-pty = { workspace = true }
dirs = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }
